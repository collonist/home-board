<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホームボード</title>
<link rel="stylesheet" href="app.css?v=202610311200">
</head>
<body>
<div class="page">
  <header>
    <div id="clock"></div>
    <div id="status"></div>
  </header>

  <section id="board" class="card">
    <h2>連絡板</h2>
    <div class="meta"><span id="sender"></span><small id="time"></small><span id="histBadge" hidden></span></div>
    <div class="body">
      <div id="text">読み込み中…</div>
      <img id="photo" alt="写真">
    </div>
    <div class="actions">
      <button type="button" id="prevBtn" disabled>前の連絡</button>
      <button type="button" id="latestBtn" hidden>さいしん</button>
      <button type="button" id="readBtn" disabled>読んだ</button>
    </div>
    <div class="reply">
      <input type="text" id="replyText" maxlength="200" placeholder="おうちの人へメッセージ" autocomplete="off" enterkeyhint="send">
      <button type="button" id="replyBtn">送る</button>
    </div>
  </section>

  <div class="side">
    <section id="wx" class="card"><h2>天気</h2><div id="wxBody"><div class="soon">準備中</div></div></section>
    <section id="ln" class="card"><h2>今週の給食</h2><div id="lnBody"><div class="soon">準備中</div></div></section>
  </div>

  <section id="week" class="card"><h2><span>今週の予定</span><button type="button" id="calBtn">更新</button></h2><div id="weekList"><div class="soon">準備中</div></div></section>
</div>
<div id="toast"></div>

<div id="pair" class="hidden">
  <h1>おうちの人に番号をもらってね</h1>
  <div id="pairCode"></div>
  <div id="pairMsg"></div>
  <div id="keypad"></div>
</div>

<script src="app.js?v=202610311200"></script>
</body>
</html>
